name: Vocabulario (temporal)
on:
  push:
    branches: [claude/exy-inicial]
    paths: [.github/workflows/vocab.yml]
jobs:
  vocab:
    runs-on: ubuntu-latest
    env:
      VOSK_MODEL: vosk-model-small-es-0.42
    steps:
      - uses: actions/cache@v4
        with:
          path: ~/vosk/${{ env.VOSK_MODEL }}
          key: ${{ env.VOSK_MODEL }}
      - run: |
          if [ ! -f "$HOME/vosk/$VOSK_MODEL/am/final.mdl" ]; then
            mkdir -p ~/vosk && curl -fsSL -o /tmp/m.zip "https://alphacephei.com/vosk/models/$VOSK_MODEL.zip" && unzip -q /tmp/m.zip -d ~/vosk
          fi
          pip install -q vosk
      - shell: python
        run: |
          import os, json, subprocess, sys, textwrap
          words = """oye oie olle oy hoy hey ey exi exy exis ex si i eks equis sexy
          vamos a al abre abrir ir ve
          claude claud clod clot clau cloud clo glod clous clous claudio cláudio clode close
          code cod coud coude cou kod co cold codi codigo código
          chat chad chats chatgpt gpt ge pe te yipití yipiti jipiti gipiti gipití ji pi ti che pití chati
          gemini géminis geminis yemini jemini gémini
          cloudcode""".split()
          code = textwrap.dedent(f'''
          import json, vosk
          m = vosk.Model(os.path.expanduser("~/vosk/{os.environ["VOSK_MODEL"]}"))
          vosk.KaldiRecognizer(m, 16000, json.dumps({json.dumps(words)} + ["[unk]"]))
          ''')
          r = subprocess.run([sys.executable, "-c", "import os\n" + code], capture_output=True, text=True)
          missing = set()
          for line in r.stderr.splitlines():
              if "missing in vocabulary" in line:
                  missing.add(line.split("'")[1])
          print("rc", r.returncode)
          print("PRESENTES:", " ".join(w for w in words if w not in missing))
          print("FALTAN:   ", " ".join(w for w in words if w in missing))
          if r.returncode: print(r.stderr[-3000:])
