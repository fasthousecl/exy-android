name: Compilar APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Compilar APK debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Renombrar APK
        id: apk
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/debug/app-debug.apk "Exy-${VERSION}.apk"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "file=Exy-${VERSION}.apk" >> "$GITHUB_OUTPUT"

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Exy-${{ steps.apk.outputs.version }}
          path: ${{ steps.apk.outputs.file }}

      # Solo los push a main se publican como Release descargable.
      - name: Publicar Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.apk.outputs.version }}"
          NOTES="APK debug compilado desde el commit ${GITHUB_SHA::7}.

          $(git log -1 --pretty=%B)

          Para instalar: descarga el archivo .apk de abajo desde el teléfono y ábrelo. Ver el README para los pasos completos."
          gh release create "$TAG" "${{ steps.apk.outputs.file }}" \
            --target "$GITHUB_SHA" \
            --title "Exy ${{ steps.apk.outputs.version }}" \
            --notes "$NOTES" \
            --latest
