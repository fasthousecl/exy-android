name: Compilar APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Modelo pequeño de Vosk en español: https://alphacephei.com/vosk/models
  VOSK_MODEL: vosk-model-small-es-0.42

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Caché del modelo de voz
        uses: actions/cache@v4
        with:
          path: ~/vosk/${{ env.VOSK_MODEL }}
          key: ${{ env.VOSK_MODEL }}

      - name: Descargar modelo de voz en español
        run: |
          set -euo pipefail
          if [ ! -f "$HOME/vosk/$VOSK_MODEL/am/final.mdl" ]; then
            mkdir -p "$HOME/vosk"
            curl -fsSL --retry 4 -o /tmp/model.zip "https://alphacephei.com/vosk/models/$VOSK_MODEL.zip"
            unzip -q /tmp/model.zip -d "$HOME/vosk"
          fi
          DEST=app/src/main/assets/model-es
          rm -rf "$DEST"
          mkdir -p app/src/main/assets
          cp -r "$HOME/vosk/$VOSK_MODEL" "$DEST"
          # La app solo vuelve a copiar el modelo al teléfono si este valor cambia.
          echo "$VOSK_MODEL" > "$DEST/uuid"
          du -sh "$DEST"

      - name: Revisar comandos de voz contra el modelo
        run: |
          # espeak-ng es solo para la prueba informativa con voz sintética.
          (sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng) > /dev/null || echo "Sin espeak-ng"
          pip install -q vosk
          python3 .github/scripts/revisar_comandos.py "$HOME/vosk/$VOSK_MODEL"

      - name: Compilar APK debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Renombrar APK
        id: apk
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/debug/app-debug.apk "Exy-${VERSION}.apk"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "file=Exy-${VERSION}.apk" >> "$GITHUB_OUTPUT"

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Exy-${{ steps.apk.outputs.version }}
          path: ${{ steps.apk.outputs.file }}

      # Solo los push a main se publican como Release descargable.
      - name: Publicar Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.apk.outputs.version }}"
          NOTES="APK debug compilado desde el commit ${GITHUB_SHA::7}.

          $(git log -1 --pretty=%B)

          Para instalar: descarga el archivo .apk de abajo desde el teléfono y ábrelo. Ver el README para los pasos completos."
          gh release create "$TAG" "${{ steps.apk.outputs.file }}" \
            --target "$GITHUB_SHA" \
            --title "Exy ${{ steps.apk.outputs.version }}" \
            --notes "$NOTES" \
            --latest
